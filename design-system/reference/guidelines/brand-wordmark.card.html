<!-- @dsCard group="Brand" viewport="700x160" name="Wordmark" subtitle="No logo was supplied — the name is set in Rubik Bold, tracked out" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Wordmark</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="g" style="gap:18px">
<div class="r" style="gap:28px">
<span style="font:var(--fw-bold) 22px/1 var(--font-core);color:var(--ink-100);letter-spacing:.06em;text-transform:uppercase">My System Life</span>
<span style="display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:var(--r-lg);background:var(--purple-500);font:var(--fw-bold) 18px/1 var(--font-core);color:#fff;letter-spacing:.06em;text-transform:uppercase">My System Life</span>
</div>
<div class="v">Uppercase, Bold 700, 0.06em tracking. Reverse it out of <span class="tok">--purple-500</span> or set it in <span class="tok">--ink-100</span> on the canvas. Never stretch, outline or add a mark.</div>
</div></body></html>

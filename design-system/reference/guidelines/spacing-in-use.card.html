<!-- @dsCard group="Spacing" viewport="700x170" name="Card density" subtitle="20px padding, 16px gutter between cards" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Card density</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--card-gap)">
<div style="padding:var(--card-pad-lg);background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card)"><div style="width:38px;height:38px;border-radius:50%;background:var(--surface-raised);border:1px solid var(--border-hairline);margin-bottom:var(--sp-9)"></div><div style="font:var(--type-metric);color:var(--text-heading)">1174</div><div style="font:var(--type-body);color:var(--text-muted);margin-top:4px">Total amount of orders</div></div><div style="padding:var(--card-pad-lg);background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card)"><div style="width:38px;height:38px;border-radius:50%;background:var(--surface-raised);border:1px solid var(--border-hairline);margin-bottom:var(--sp-9)"></div><div style="font:var(--type-metric);color:var(--text-heading)">$8,126,420</div><div style="font:var(--type-body);color:var(--text-muted);margin-top:4px">Total money paid</div></div><div style="padding:var(--card-pad-lg);background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card)"><div style="width:38px;height:38px;border-radius:50%;background:var(--surface-raised);border:1px solid var(--border-hairline);margin-bottom:var(--sp-9)"></div><div style="font:var(--type-metric);color:var(--text-heading)">29</div><div style="font:var(--type-body);color:var(--text-muted);margin-top:4px">Available courier</div></div>
</div></body></html>

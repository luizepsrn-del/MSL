<!-- @dsCard group="Colors" viewport="700x130" name="Semantic accents" subtitle="Green on-track, orange delay, red alert" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Semantic accents</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
<div class="sw"><div class="chip" style="background:var(--green-500);"></div><span class="n">Green 500</span><span class="tok">--green-500</span></div><div class="sw"><div class="chip" style="background:var(--green-600);"></div><span class="n">Green 600</span><span class="tok">--green-600</span></div><div class="sw"><div class="chip" style="background:var(--orange-500);"></div><span class="n">Orange 500</span><span class="tok">--orange-500</span></div><div class="sw"><div class="chip" style="background:var(--orange-600);"></div><span class="n">Orange 600</span><span class="tok">--orange-600</span></div><div class="sw"><div class="chip" style="background:var(--red-500);"></div><span class="n">Red 500</span><span class="tok">--red-500</span></div><div class="sw"><div class="chip" style="background:var(--red-600);"></div><span class="n">Red 600</span><span class="tok">--red-600</span></div>
</div></body></html>

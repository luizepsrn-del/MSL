<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Short, linear-feeling transitions; no bounce" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="g" style="gap:8px">
<div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:140px">--dur-instant</span><span class="n" style="width:190px;overflow:hidden;text-overflow:ellipsis">80ms</span><span class="v">press feedback</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:140px">--dur-fast</span><span class="n" style="width:190px;overflow:hidden;text-overflow:ellipsis">140ms</span><span class="v">hover, colour change</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:140px">--dur-base</span><span class="n" style="width:190px;overflow:hidden;text-overflow:ellipsis">200ms</span><span class="v">toggle knob, chevron rotate</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:140px">--dur-slow</span><span class="n" style="width:190px;overflow:hidden;text-overflow:ellipsis">320ms</span><span class="v">bar and chart growth</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:140px">--ease-standard</span><span class="n" style="width:190px;overflow:hidden;text-overflow:ellipsis">cubic-bezier(.4,0,.2,1)</span><span class="v">default</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:140px">--ease-out</span><span class="n" style="width:190px;overflow:hidden;text-overflow:ellipsis">cubic-bezier(.16,1,.3,1)</span><span class="v">entering, growth</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:140px">--press-scale</span><span class="n" style="width:190px;overflow:hidden;text-overflow:ellipsis">.97</span><span class="v">button press</span></div>
</div></body></html>

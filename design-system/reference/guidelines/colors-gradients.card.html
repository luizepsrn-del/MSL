<!-- @dsCard group="Colors" viewport="700x150" name="Gradients" subtitle="Primary action, active nav, KPI glow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Gradients</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div class="sw"><div class="chip" style="height:74px;background:var(--gradient-primary);box-shadow:var(--inset-top-sheen)"></div><span class="n">Primary action</span><span class="tok">--gradient-primary</span></div>
<div class="sw"><div class="chip" style="height:74px;background:var(--gradient-nav-active)"></div><span class="n">Active nav item</span><span class="tok">--gradient-nav-active</span></div>
<div class="sw"><div class="chip" style="height:74px;background:var(--surface-card);position:relative;overflow:hidden"><span style="position:absolute;inset:0;background:var(--gradient-kpi-glow)"></span></div><span class="n">Lead KPI glow</span><span class="tok">--gradient-kpi-glow</span></div>
</div></body></html>

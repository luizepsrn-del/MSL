<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="8 controls · 12 cards · 16 panels · pill for status" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px">
<div class="sw"><div style="height:58px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--r-sm)"></div><span class="n">6px</span><span class="tok">--r-sm</span></div><div class="sw"><div style="height:58px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--r-md)"></div><span class="n">8px</span><span class="tok">--r-md</span></div><div class="sw"><div style="height:58px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--r-lg)"></div><span class="n">10px</span><span class="tok">--r-lg</span></div><div class="sw"><div style="height:58px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--r-xl)"></div><span class="n">12px</span><span class="tok">--r-xl</span></div><div class="sw"><div style="height:58px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--r-2xl)"></div><span class="n">16px</span><span class="tok">--r-2xl</span></div><div class="sw"><div style="height:58px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--r-3xl)"></div><span class="n">20px</span><span class="tok">--r-3xl</span></div><div class="sw"><div style="height:58px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--r-pill)"></div><span class="n">999px</span><span class="tok">--r-pill</span></div>
</div></body></html>

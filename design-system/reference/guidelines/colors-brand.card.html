<!-- @dsCard group="Colors" viewport="700x130" name="Brand purple" subtitle="The one hue the product is built on — 682EC7 is primary" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Brand purple</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="r" style="display:grid;grid-template-columns:repeat(9,1fr)">
<div class="sw"><div class="chip" style="background:var(--purple-900);"></div><span class="n">900</span><span class="tok">--purple-900</span></div><div class="sw"><div class="chip" style="background:var(--purple-800);"></div><span class="n">800</span><span class="tok">--purple-800</span></div><div class="sw"><div class="chip" style="background:var(--purple-700);"></div><span class="n">700</span><span class="tok">--purple-700</span></div><div class="sw"><div class="chip" style="background:var(--purple-600);"></div><span class="n">600</span><span class="tok">--purple-600</span></div><div class="sw"><div class="chip" style="background:var(--purple-500);box-shadow:0 0 0 2px var(--purple-300) inset"></div><span class="n">500</span><span class="tok">--purple-500</span></div><div class="sw"><div class="chip" style="background:var(--purple-400);"></div><span class="n">400</span><span class="tok">--purple-400</span></div><div class="sw"><div class="chip" style="background:var(--purple-300);"></div><span class="n">300</span><span class="tok">--purple-300</span></div><div class="sw"><div class="chip" style="background:var(--purple-200);"></div><span class="n">200</span><span class="tok">--purple-200</span></div><div class="sw"><div class="chip" style="background:var(--purple-100);"></div><span class="n">100</span><span class="tok">--purple-100</span></div>
</div></body></html>

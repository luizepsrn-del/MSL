<!-- @dsCard group="Colors" viewport="700x150" name="Bar gradients" subtitle="Fleet-mix fills, dark→bright left to right" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Bar gradients</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="g" style="gap:14px">
<div><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span class="n">Trucks</span><span class="tok">--gradient-bar-purple</span></div><div style="height:8px;border-radius:var(--r-pill);background:var(--surface-raised);overflow:hidden"><span style="display:block;width:57%;height:100%;border-radius:var(--r-pill);background:var(--gradient-bar-purple)"></span></div></div><div><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span class="n">Cargo Vans</span><span class="tok">--gradient-bar-green</span></div><div style="height:8px;border-radius:var(--r-pill);background:var(--surface-raised);overflow:hidden"><span style="display:block;width:18%;height:100%;border-radius:var(--r-pill);background:var(--gradient-bar-green)"></span></div></div><div><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span class="n">Trailers</span><span class="tok">--gradient-bar-orange</span></div><div style="height:8px;border-radius:var(--r-pill);background:var(--surface-raised);overflow:hidden"><span style="display:block;width:9%;height:100%;border-radius:var(--r-pill);background:var(--gradient-bar-orange)"></span></div></div><div><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span class="n">Cargo planes</span><span class="tok">--gradient-bar-neutral</span></div><div style="height:8px;border-radius:var(--r-pill);background:var(--surface-raised);overflow:hidden"><span style="display:block;width:7%;height:100%;border-radius:var(--r-pill);background:var(--gradient-bar-neutral)"></span></div></div>
</div></body></html>

<!-- @dsCard group="Spacing" viewport="700x170" name="Layout metrics" subtitle="Fixed shell dimensions and control heights" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Layout metrics</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="g" style="gap:8px">
<div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:150px">--sidebar-w</span><span class="n" style="width:56px">224px</span><span class="v">navigation rail</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:150px">--topbar-h</span><span class="n" style="width:56px">72px</span><span class="v">application bar</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:150px">--shell-gutter</span><span class="n" style="width:56px">20px</span><span class="v">shell padding</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:150px">--card-pad-lg</span><span class="n" style="width:56px">20px</span><span class="v">card padding</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:150px">--row-h</span><span class="n" style="width:56px">56px</span><span class="v">table row</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:150px">--control-h</span><span class="n" style="width:56px">36px</span><span class="v">default control</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:150px">--control-h-lg</span><span class="n" style="width:56px">44px</span><span class="v">mobile / modal control</span></div><div style="display:flex;align-items:center;gap:14px"><span class="tok" style="width:150px">--tap-min</span><span class="n" style="width:56px">44px</span><span class="v">touch target floor</span></div>
</div></body></html>

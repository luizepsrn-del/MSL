<!-- @dsCard group="Type" viewport="700x180" name="Rubik" subtitle="One family, five weights — Light 300 to Bold 700" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Rubik</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div style="font:var(--fw-light) 64px/1 var(--font-core);color:var(--ink-100);letter-spacing:var(--ls-tight)">Rubik</div>
<div class="r" style="margin-top:16px;gap:22px">
<span style="font:300 15px/1 var(--font-core);color:var(--text-body)">Light</span><span style="font:400 15px/1 var(--font-core);color:var(--text-body)">Regular</span><span style="font:500 15px/1 var(--font-core);color:var(--text-body)">Medium</span><span style="font:600 15px/1 var(--font-core);color:var(--text-body)">SemiBold</span><span style="font:700 15px/1 var(--font-core);color:var(--text-body)">Bold</span>
</div><div class="tok" style="margin-top:12px">--font-core · --fw-light/regular/medium/semibold/bold</div></body></html>

<!-- @dsCard group="Type" viewport="700x200" name="Type roles" subtitle="Composite font shorthands used in components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Type roles</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="g" style="gap:14px">
<div><div style="font:var(--type-page-title);color:var(--text-heading)">Analytics</div><div style="font:var(--type-page-subtitle);color:var(--text-muted)">Data analytics and insights</div><div class="tok" style="margin-top:4px">--type-page-title · --type-page-subtitle</div></div>
<div><div style="font:var(--type-card-title);color:var(--text-heading)">Monthly Revenue</div><div class="tok" style="margin-top:4px">--type-card-title</div></div>
<div><div style="font:var(--type-metric);color:var(--text-heading)">$8,126,420</div><div class="tok" style="margin-top:4px">--type-metric</div></div>
</div></body></html>

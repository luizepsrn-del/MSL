<!-- @dsCard group="Colors" viewport="700x110" name="Chart palette" subtitle="Five series, ordered by importance" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Chart palette</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
<div class="sw"><div class="chip" style="background:var(--chart-1);"></div><span class="n">Series 1</span><span class="tok">--chart-1</span></div><div class="sw"><div class="chip" style="background:var(--chart-2);"></div><span class="n">Series 2</span><span class="tok">--chart-2</span></div><div class="sw"><div class="chip" style="background:var(--chart-3);"></div><span class="n">Series 3</span><span class="tok">--chart-3</span></div><div class="sw"><div class="chip" style="background:var(--chart-4);"></div><span class="n">Series 4</span><span class="tok">--chart-4</span></div><div class="sw"><div class="chip" style="background:var(--chart-5);"></div><span class="n">Series 5</span><span class="tok">--chart-5</span></div>
</div></body></html>

<!-- @dsCard group="Colors" viewport="700x110" name="Status tokens" subtitle="Tinted fill + hairline + full-strength label" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status tokens</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="r" style="gap:14px">
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--r-pill);background:var(--status-ontime-bg);border:1px solid var(--status-ontime-bd);color:var(--status-ontime-fg);font:var(--fw-medium) 12px/1 var(--font-core)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>On Time</span><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--r-pill);background:var(--status-delay-bg);border:1px solid var(--status-delay-bd);color:var(--status-delay-fg);font:var(--fw-medium) 12px/1 var(--font-core)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Delay</span><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--r-pill);background:var(--status-delivered-bg);border:1px solid var(--status-delivered-bd);color:var(--status-delivered-fg);font:var(--fw-medium) 12px/1 var(--font-core)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Delivered</span><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--r-pill);background:var(--status-danger-bg);border:1px solid var(--status-danger-bd);color:var(--status-danger-fg);font:var(--fw-medium) 12px/1 var(--font-core)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Cancelled</span>
</div><div class="tok" style="margin-top:12px">--status-{ontime|delay|delivered|danger}-{fg|bg|bd}</div></body></html>

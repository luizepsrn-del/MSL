<!-- @dsCard group="Colors" viewport="700x130" name="Text colours" subtitle="Four levels; muted 74769A carries all captions" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Text colours</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div class="sw"><span style="font:var(--fw-medium) 20px/1.2 var(--font-core);color:var(--text-heading)">Heading</span><span class="tok">--text-heading</span></div>
<div class="sw"><span style="font:var(--fw-regular) 20px/1.2 var(--font-core);color:var(--text-body)">Body</span><span class="tok">--text-body</span></div>
<div class="sw"><span style="font:var(--fw-regular) 20px/1.2 var(--font-core);color:var(--text-muted)">Muted</span><span class="tok">--text-muted</span></div>
<div class="sw"><span style="font:var(--fw-regular) 20px/1.2 var(--font-core);color:var(--text-subtle)">Subtle</span><span class="tok">--text-subtle</span></div>
</div></body></html>

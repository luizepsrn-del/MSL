<!-- @dsCard group="Type" viewport="700x140" name="Figures in data" subtitle="Medium weight, tight tracking, zero-padded page and rank numbers" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Figures</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="r" style="gap:32px;align-items:baseline">
<span style="font:var(--type-metric-lg);color:var(--text-heading);letter-spacing:var(--ls-tight)">89,011</span>
<span style="font:var(--type-metric);color:var(--text-heading);letter-spacing:var(--ls-tight)">1174</span>
<span style="font:var(--fw-medium) 20px/1 var(--font-core);color:var(--text-heading)">7<span style="color:var(--text-subtle)">/8</span></span>
<span style="font:var(--fw-medium) 12px/1 var(--font-core);color:var(--text-muted)">01&nbsp;&nbsp;02&nbsp;&nbsp;03&nbsp;&nbsp;…&nbsp;&nbsp;06</span>
<span style="font:var(--fw-medium) 12px/1 var(--font-core);color:var(--green-500)">57%</span>
</div></body></html>

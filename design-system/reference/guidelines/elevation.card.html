<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation & glow" subtitle="Shadows stay subtle; purple glow marks the primary action" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div class="sw"><div style="height:62px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card)"></div><span class="n">Card</span><span class="tok">--shadow-card</span></div><div class="sw"><div style="height:62px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-card);box-shadow:var(--shadow-raised)"></div><span class="n">Raised</span><span class="tok">--shadow-raised</span></div><div class="sw"><div style="height:62px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-card);box-shadow:var(--shadow-pop)"></div><span class="n">Popover</span><span class="tok">--shadow-pop</span></div><div class="sw"><div style="height:62px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-card);box-shadow:var(--shadow-modal)"></div><span class="n">Modal</span><span class="tok">--shadow-modal</span></div>
</div><div class="r" style="margin-top:16px;gap:14px">
<span style="height:36px;padding:0 18px;display:inline-flex;align-items:center;border-radius:var(--r-control);background:var(--gradient-primary);color:#fff;font:var(--fw-medium) 13px/1 var(--font-core);box-shadow:var(--glow-accent)">--glow-accent</span>
<span style="width:36px;height:36px;border-radius:50%;background:var(--purple-500);box-shadow:var(--glow-accent-strong)"></span>
<span class="tok">--glow-accent-strong</span></div></body></html>

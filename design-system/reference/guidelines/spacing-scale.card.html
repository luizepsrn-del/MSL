<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="2px base step, 4px rhythm from --sp-4 up" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="g" style="gap:7px">
<div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-1</span><span class="v" style="width:36px">2px</span><span style="height:9px;width:6px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-2</span><span class="v" style="width:36px">4px</span><span style="height:9px;width:12px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-3</span><span class="v" style="width:36px">6px</span><span style="height:9px;width:18px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-4</span><span class="v" style="width:36px">8px</span><span style="height:9px;width:24px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-5</span><span class="v" style="width:36px">10px</span><span style="height:9px;width:30px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-6</span><span class="v" style="width:36px">12px</span><span style="height:9px;width:36px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-8</span><span class="v" style="width:36px">16px</span><span style="height:9px;width:48px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-9</span><span class="v" style="width:36px">20px</span><span style="height:9px;width:60px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-10</span><span class="v" style="width:36px">24px</span><span style="height:9px;width:72px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-12</span><span class="v" style="width:36px">32px</span><span style="height:9px;width:96px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-14</span><span class="v" style="width:36px">40px</span><span style="height:9px;width:120px;border-radius:2px;background:var(--purple-500)"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="tok" style="width:74px">--sp-16</span><span class="v" style="width:36px">48px</span><span style="height:9px;width:144px;border-radius:2px;background:var(--purple-500)"></span></div>
</div></body></html>

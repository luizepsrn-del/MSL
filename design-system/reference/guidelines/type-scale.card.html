<!-- @dsCard group="Type" viewport="700x330" name="Size scale" subtitle="Source pins Heading 24 / Sub-heading 20 / Body 12" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Size scale</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="g" style="gap:9px">
<div style="display:flex;align-items:baseline;gap:14px"><span class="tok" style="width:130px">--fs-display</span><span class="v" style="width:34px">40px</span><span style="font:var(--fw-regular) 40px/1.15 var(--font-core);color:var(--text-body)">Display</span></div><div style="display:flex;align-items:baseline;gap:14px"><span class="tok" style="width:130px">--fs-title</span><span class="v" style="width:34px">32px</span><span style="font:var(--fw-regular) 32px/1.15 var(--font-core);color:var(--text-body)">Title</span></div><div style="display:flex;align-items:baseline;gap:14px"><span class="tok" style="width:130px">--fs-heading</span><span class="v" style="width:34px">24px</span><span style="font:var(--fw-regular) 24px/1.15 var(--font-core);color:var(--text-body)">Heading</span></div><div style="display:flex;align-items:baseline;gap:14px"><span class="tok" style="width:130px">--fs-subheading</span><span class="v" style="width:34px">20px</span><span style="font:var(--fw-regular) 20px/1.15 var(--font-core);color:var(--text-body)">Sub-heading</span></div><div style="display:flex;align-items:baseline;gap:14px"><span class="tok" style="width:130px">--fs-lg</span><span class="v" style="width:34px">16px</span><span style="font:var(--fw-regular) 16px/1.15 var(--font-core);color:var(--text-body)">Card title</span></div><div style="display:flex;align-items:baseline;gap:14px"><span class="tok" style="width:130px">--fs-md</span><span class="v" style="width:34px">14px</span><span style="font:var(--fw-regular) 14px/1.15 var(--font-core);color:var(--text-body)">Nav / control</span></div><div style="display:flex;align-items:baseline;gap:14px"><span class="tok" style="width:130px">--fs-body</span><span class="v" style="width:34px">12px</span><span style="font:var(--fw-regular) 12px/1.15 var(--font-core);color:var(--text-body)">Body</span></div><div style="display:flex;align-items:baseline;gap:14px"><span class="tok" style="width:130px">--fs-xs</span><span class="v" style="width:34px">11px</span><span style="font:var(--fw-regular) 11px/1.15 var(--font-core);color:var(--text-body)">Meta</span></div><div style="display:flex;align-items:baseline;gap:14px"><span class="tok" style="width:130px">--fs-micro</span><span class="v" style="width:34px">10px</span><span style="font:var(--fw-regular) 10px/1.15 var(--font-core);color:var(--text-body)">Badge</span></div>
</div></body></html>

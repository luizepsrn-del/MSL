<!-- @dsCard group="Colors" viewport="700x130" name="Ink ramp" subtitle="06071A canvas up to E0E1EE body text" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ink ramp</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:10px">
<div class="sw"><div class="chip" style="background:var(--ink-1000);"></div><span class="n">1000</span><span class="tok">--ink-1000</span></div><div class="sw"><div class="chip" style="background:var(--ink-900);"></div><span class="n">900</span><span class="tok">--ink-900</span></div><div class="sw"><div class="chip" style="background:var(--ink-850);"></div><span class="n">850</span><span class="tok">--ink-850</span></div><div class="sw"><div class="chip" style="background:var(--ink-800);"></div><span class="n">800</span><span class="tok">--ink-800</span></div><div class="sw"><div class="chip" style="background:var(--ink-700);"></div><span class="n">700</span><span class="tok">--ink-700</span></div><div class="sw"><div class="chip" style="background:var(--ink-600);"></div><span class="n">600</span><span class="tok">--ink-600</span></div><div class="sw"><div class="chip" style="background:var(--ink-500);"></div><span class="n">500</span><span class="tok">--ink-500</span></div><div class="sw"><div class="chip" style="background:var(--ink-400);"></div><span class="n">400</span><span class="tok">--ink-400</span></div><div class="sw"><div class="chip" style="background:var(--ink-200);"></div><span class="n">200</span><span class="tok">--ink-200</span></div><div class="sw"><div class="chip" style="background:var(--ink-100);"></div><span class="n">100</span><span class="tok">--ink-100</span></div>
</div></body></html>

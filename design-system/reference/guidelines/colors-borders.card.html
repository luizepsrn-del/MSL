<!-- @dsCard group="Colors" viewport="700x140" name="Borders" subtitle="Hairlines do the separating; no heavy rules anywhere" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Borders</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-app);font:var(--type-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{height:52px;border-radius:var(--r-md);border:1px solid var(--border-hairline)}
.n{font:var(--fw-medium) 11px/1.3 var(--font-core);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:var(--fw-regular) 10px/1.3 var(--font-core);color:var(--text-subtle);white-space:nowrap}
.tok{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div class="sw"><div style="height:60px;border-radius:var(--r-md);background:var(--surface-card);border:1px solid var(--border-hairline)"></div><span class="n">hairline</span><span class="tok">--border-hairline</span></div><div class="sw"><div style="height:60px;border-radius:var(--r-md);background:var(--surface-card);border:1px solid var(--border-default)"></div><span class="n">default</span><span class="tok">--border-default</span></div><div class="sw"><div style="height:60px;border-radius:var(--r-md);background:var(--surface-card);border:1px solid var(--border-strong)"></div><span class="n">strong</span><span class="tok">--border-strong</span></div><div class="sw"><div style="height:60px;border-radius:var(--r-md);background:var(--surface-card);border:1px solid var(--border-accent)"></div><span class="n">accent</span><span class="tok">--border-accent</span></div>
</div></body></html>

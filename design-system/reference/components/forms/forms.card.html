<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Forms</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface-app)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--fw-regular) 10px/1 var(--font-core);color:var(--text-subtle);letter-spacing:var(--ls-caps);text-transform:uppercase}</style></head><body><div id="root"></div>
<script type="text/babel">
const { SearchInput, Checkbox, Switch, Radio, Select } = window.MySystemLifeDesignSystem_265e57;
function Demo(){
  const [q,setQ]=React.useState(''); const [a,setA]=React.useState(true); const [b,setB]=React.useState(true);
  const [s,setS]=React.useState('last'); const [v,setV]=React.useState('all');
  return (
    <div className="col">
      <div className="row">
        <div style={{width:200}}><SearchInput value={q} onChange={setQ} placeholder="Search" shortcut="F" fullWidth /></div>
        <div style={{width:240}}><SearchInput value="" placeholder="Search or type command" fullWidth /></div>
        <div style={{width:150}}><Select value={v} onChange={setV} fullWidth options={[{value:'all',label:'All Orders'},{value:'delay',label:'Delayed'},{value:'done',label:'Delivered'}]} /></div>
      </div>
      <div className="row" style={{gap:28}}>
        <Checkbox checked={a} onChange={setA} label="Selected" />
        <Checkbox indeterminate label="Some" />
        <Checkbox label="Unselected" />
        <Checkbox label="Disabled" disabled />
        <Switch checked={b} onChange={setB} />
        <Switch checked={false} />
        <Switch checked label="Notify me" size="sm" />
      </div>
      <Radio value={s} onChange={setS} options={[{value:'last',label:'Last Year'},{value:'prev',label:'Previous Year'}]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>

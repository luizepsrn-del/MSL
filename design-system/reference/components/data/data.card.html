<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Data</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface-app)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--fw-regular) 10px/1 var(--font-core);color:var(--text-subtle);letter-spacing:var(--ls-caps);text-transform:uppercase}</style></head><body><div id="root"></div>
<script type="text/babel">
const { StatCard, DataTable, SelectionToolbar, DonutChart, LineChart, BarChart, MetricBarList, CarrierRow, Badge, Button, IconButton, Card, Select } = window.MySystemLifeDesignSystem_265e57;
const rows=[
 {id:'4511829208',from:'Viborg, Denmark',to:'Siedice, Poland',price:'$950',date:'Jan 3, 2025',status:'Delay',tone:'delay'},
 {id:'44511828177',from:'Viborg, Denmark',to:'Siedice, Poland',price:'$1,150',date:'Jan 5, 2025',status:'On Time',tone:'ontime'},
 {id:'4500221765',from:'Viborg, Denmark',to:'Siedice, Poland',price:'$1,450',date:'Dec 18, 2024',status:'Delivered',tone:'delivered'},
];
function Demo(){
  const [sel,setSel]=React.useState(['44511828177']);
  return (
    <div className="col" style={{gap:18}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:14}}>
        <StatCard glow icon="wallet" value="1174" label="Total amount of orders" />
        <StatCard icon="banknote" value="$8,126,420" label="Total money paid" />
        <StatCard icon="truck" value="29" label="Available courier" />
        <StatCard icon="clock" value="89,011" label="Hours on the road" />
      </div>
      <div style={{display:'grid',gridTemplateColumns:'minmax(0,1.6fr) minmax(0,1fr)',gap:14,alignItems:'start'}}>
        <div className="col" style={{gap:12}}>
          <SelectionToolbar count={1} actions={<><Button variant="secondary" size="sm">Dismiss</Button><Button variant="secondary" size="sm">Send Invoice</Button></>} trailing={<Select value="all" options={[{value:'all',label:'All Orders'}]} size="sm" />} />
          <DataTable selectable selected={sel} onSelectedChange={setSel} rows={rows}
            columns={[
              {key:'id',header:'Order',width:'minmax(0,1.1fr)',sortable:true},
              {key:'dest',header:'Destinations',width:'minmax(0,1.3fr)',render:r=>(<span style={{font:'var(--type-body)'}}><span style={{color:'var(--text-muted)'}}>From: </span>{r.from}<br/><span style={{color:'var(--text-muted)'}}>To: </span>{r.to}</span>)},
              {key:'price',header:'Price',width:'80px',sortable:true},
              {key:'status',header:'Status',width:'110px',sortable:true,render:r=><Badge tone={r.tone}>{r.status}</Badge>},
              {key:'act',header:'Action',width:'44px',align:'right',render:()=><IconButton icon="more-vertical" label="Actions" variant="ghost" size={28} />},
            ]} />
          <BarChart height={90} highlightIndex={5} valueLabel="382" labels={['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug']} data={[120,180,140,260,190,382,210,170]} />
        </div>
        <Card title="Top Carriers" action={<Button variant="secondary" size="sm" iconRight="arrow-right">See All</Button>}>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:16}}>
            <DonutChart size={130} thickness={20} centerValue="100%" centerLabel="Total" segments={[{value:57,color:'var(--chart-1)'},{value:18,color:'var(--chart-2)'},{value:9,color:'var(--chart-3)'},{value:16,color:'var(--chart-4)'}]} />
            <MetricBarList style={{width:'100%'}} items={[{label:'Trucks',value:57,tone:'purple'},{label:'Cargo Vans',value:18,tone:'green'},{label:'Trailers',value:9,tone:'orange'}]} />
          </div>
        </Card>
      </div>
      <Card title="Monthly Revenue" onMenuClick={()=>{}}>
        <LineChart height={120} highlightIndex={4} tooltip="$30,89 per munth" yTicks={['$10,000','$5000','$2000','$1000']}
          labels={['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']}
          series={[{data:[2400,3200,2800,4200,2100,3800,4600,3400,5200,4100,3300,5600]},{data:[3000,2400,3600,2900,4400,3100,2700,4900,3600,4800,3900,4200],color:'var(--chart-5)',width:2}]} />
      </Card>
      <Card flush title="Top Carriers" style={{paddingBottom:0}}>
        <CarrierRow rank={1} name="Arkas Logistics" location="Belfast, United Kingdom" rating="8.7" reviews={116} vehicles={21} partners={12} />
        <CarrierRow rank={2} name="Zim Integrated" location="Belfast, United Kingdom" rating="8.1" reviews={74} vehicles={19} partners={16} />
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>

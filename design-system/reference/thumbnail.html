<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>My System Life</title><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden;background:var(--purple-500)}

<div class="strip"><span style="background:var(--green-500)"></span><span style="background:var(--orange-500)"></span><span style="background:var(--red-500)"></span><span style="background:var(--ink-1000)"></span></div>
</body></html>

<!-- @startingPoint section="Admin Dashboard" subtitle="Mobile dashboard with drawer navigation and stacked data views" viewport="900x780" -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My System Life — Admin Dashboard (mobile)</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../admin_desktop/data.js"></script>
<style>html,body{height:100%}body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:radial-gradient(90% 70% at 50% 0%,#1B1136 0%,var(--surface-app) 70%)}
.phone{position:relative;width:390px;height:700px;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-app);border:8px solid #16172B;border-radius:44px;box-shadow:var(--shadow-modal);transform:translateZ(0)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:26px;border-radius:var(--r-pill);background:#000;z-index:70}</style>
</head><body>
<div class="phone"><span class="notch"></span><div id="root" style="display:flex;flex-direction:column;height:100%;min-height:0"></div></div>
<script type="text/babel" src="MobileChrome.jsx"></script>
<script type="text/babel" src="MobileScreens.jsx"></script>
<script type="text/babel">
const { Sidebar, PromoCard, Modal, SuccessDialog, StepProgress, OptionCard, Button, PageHeader } = window.MySystemLifeDesignSystem_265e57;

function App() {
  const D = window.MSL_DATA;
  const [view, setView] = React.useState('analytics');
  const [drawer, setDrawer] = React.useState(false);
  const [theme, setTheme] = React.useState('dark');
  const [query, setQuery] = React.useState('');
  const [setup, setSetup] = React.useState(false);
  const [done, setDone] = React.useState(false);
  const [pick, setPick] = React.useState('carriers');
  const [title, subtitle] = D.titles[view] || ['', ''];

  const go = id => { setView(id); setDrawer(false); };
  const body = {
    overview: <window.MobileDashboard onViewPlans={() => setSetup(true)} />,
    analytics: <window.MobileDashboard onViewPlans={() => setSetup(true)} />,
    orders: <window.MobileOrders onEdit={() => setDone(true)} />,
    automations: <window.MobileAutomations />,
    carriers: <window.MobileCarriers />,
    messages: <window.MobileMessages />,
  }[view] || <window.MobilePlaceholder name={title} />;

  return (
    <>
      <window.StatusBar />
      <window.MobileHeader onMenu={() => setDrawer(true)} onProfile={() => setSetup(true)} />
      <window.MobileUtilityRow query={query} onQuery={setQuery} theme={theme} onTheme={setTheme} />
      <main style={{ flex: 1, minHeight: 0, overflowY: 'auto', overflowX: 'hidden', padding: '0 var(--sp-8) var(--sp-12)' }}>
        <PageHeader title={title} subtitle={subtitle} style={{ marginBottom: 'var(--sp-9)' }} />
        {body}
      </main>
      <window.MobileDrawer open={drawer} onClose={() => setDrawer(false)}>
        <Sidebar sections={D.nav} active={view} onSelect={go} search={false} width="100%"
          style={{ borderRight: 0, paddingTop: 'var(--sp-14)' }}
          footer={<PromoCard image="../../../assets/img/promo-rocket.png" body="Get special offers up to 12 months" onAction={() => { setDrawer(false); setSetup(true); }} />} />
      </window.MobileDrawer>

      <Modal open={setup} onClose={() => setSetup(false)} width={330}
        header={<StepProgress step={7} total={8} title="Account Set Up" subtitle="What Do You Want To Do First?" />}
        footer={<>
          <Button variant="secondary" size="lg" fullWidth onClick={() => setSetup(false)}>Skip</Button>
          <Button variant="primary" size="lg" fullWidth onClick={() => { setSetup(false); setDone(true); }}>Continue</Button>
        </>}
        >
        <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--sp-6)' }}>
          <OptionCard icon="wallet" title="Find Orders Manually" selected={pick === 'orders'} onClick={() => setPick('orders')}
            description="Manual Orders With Allow You To Analyze Every Order In More Details." />
          <OptionCard icon="truck" title="Add New Carriers" selected={pick === 'carriers'} onClick={() => setPick('carriers')}
            description="New Carriers Increase Orders Circulation And The Number Of Deals." />
          <OptionCard icon="audio-lines" title="Create Automation" selected={pick === 'auto'} onClick={() => setPick('auto')}
            description="Automated Campaigns Save Your Time In Making Super-Fast Deals" />
        </div>
      </Modal>

      <SuccessDialog open={done} onClose={() => setDone(false)} title="Order updated!"
        message="Your changes have been successfully applied" />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
